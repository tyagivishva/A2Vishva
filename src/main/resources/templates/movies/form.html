<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${formTitle}">Movie Form</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header>
        <h1>Movie Database</h1>
        <nav>
            <a th:href="@{/}">Home</a>
            <a th:href="@{/movies}">Movies</a>
            <a th:href="@{/movies/new}">Add Movie</a>
            <a th:href="@{/movies/search}">Search</a>
        </nav>
    </header>
    <main>
        <h2 th:text="${formTitle}">Movie Form</h2>
        <form th:action="${movie.id == null} ? @{/movies} : @{/movies/{id}(id=${movie.id})}" th:object="${movie}" method="post">
            <div>
                <label for="title">Title</label>
                <input type="text" id="title" th:field="*{title}">
                <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>
            <div>
                <label for="genre">Genre</label>
                <input type="text" id="genre" th:field="*{genre}">
                <div th:if="${#fields.hasErrors('genre')}" th:errors="*{genre}"></div>
            </div>
            <div>
                <label for="releaseYear">Release Year</label>
                <input type="number" id="releaseYear" th:field="*{releaseYear}">
                <div th:if="${#fields.hasErrors('releaseYear')}" th:errors="*{releaseYear}"></div>
            </div>
            <div>
                <label for="rating">Rating (0-10)</label>
                <input type="number" step="0.1" id="rating" th:field="*{rating}">
                <div th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}"></div>
            </div>
            <div>
                <label for="director">Director</label>
                <input type="text" id="director" th:field="*{director}">
                <div th:if="${#fields.hasErrors('director')}" th:errors="*{director}"></div>
            </div>
            <div>
                <label for="durationMinutes">Duration (minutes)</label>
                <input type="number" id="durationMinutes" th:field="*{durationMinutes}">
                <div th:if="${#fields.hasErrors('durationMinutes')}" th:errors="*{durationMinutes}"></div>
            </div>
            <button type="submit" th:text="${submitLabel}">Submit</button>
        </form>
    </main>
    
</body>
</html>

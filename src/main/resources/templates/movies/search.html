<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Movies</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header>
        <h1>Movie Database</h1>
        <nav>
            <a th:href="@{/}">Home</a>
            <a th:href="@{/movies}">Movies</a>
            <a th:href="@{/movies/new}">Add Movie</a>
            <a th:href="@{/movies/search}">Search</a>
        </nav>
    </header>
    <main>
        <h2>Search Movies</h2>
        <form method="get" th:action="@{/movies/search}">
            <div>
                <label for="title">Title</label>
                <input type="text" id="title" name="title" th:value="${title}">
            </div>
            <div>
                <label for="genre">Genre</label>
                <input type="text" id="genre" name="genre" th:value="${genre}">
            </div>
            <div>
                <label for="minRating">Min Rating</label>
                <input type="number" step="0.1" id="minRating" name="minRating" th:value="${minRating}">
            </div>
            <button type="submit">Search</button>
        </form>
        <h3>Results</h3>
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Genre</th>
                    <th>Year</th>
                    <th>Rating</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="movie : ${movies}">
                    <td th:text="${movie.title}">Title</td>
                    <td th:text="${movie.genre}">Genre</td>
                    <td th:text="${movie.releaseYear}">Year</td>
                    <td th:text="${movie.rating}">Rating</td>
                    <td>
                        <a th:href="@{/movies/{id}(id=${movie.id})}">View</a>
                        <a th:href="@{/movies/{id}/edit(id=${movie.id})}">Edit</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(movies)}">
                    <td colspan="5">No results found.</td>
                </tr>
            </tbody>
        </table>
    </main>
    <footer>
        <p>&copy; 2026 Vishva Tyagi</p>
    </footer>
</body>
</html>

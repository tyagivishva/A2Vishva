<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header>
        <h1>Movie Database</h1>
        <nav>
            <a th:href="@{/}">Home</a>
            <a th:href="@{/movies}">Movies</a>
            <a th:href="@{/movies/new}">Add Movie</a>
            <a th:href="@{/movies/search}">Search</a>
        </nav>
    </header>
    <main>
        <h2 th:text="${errorTitle}">Error</h2>
        <p th:text="${errorMessage}">Something went wrong.</p>
        <p th:if="${path}">Path: <span th:text="${path}">/path</span></p>
    </main>
    
</body>
</html>
